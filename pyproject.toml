[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kt-audit"
dynamic = ["version"]
description = "Audit knowledge-tracing evaluation before you trust the AUC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xia Jiang" }]
keywords = ["knowledge-tracing", "evaluation", "leakage", "education", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
  "basedpyright>=1.17",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
kt-audit = "kt_audit.cli:main"

[project.urls]
Homepage = "https://github.com/summeriver13/kt-audit"
Repository = "https://github.com/summeriver13/kt-audit"
Issues = "https://github.com/summeriver13/kt-audit/issues"

[tool.hatch.version]
path = "src/kt_audit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kt_audit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["kt_audit"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
